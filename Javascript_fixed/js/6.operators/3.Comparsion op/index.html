<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // comparison operator
        let a=10
        let b=20
        let c=10

        console.log(a==b);
        console.log(a!=b);  
        console.log(a===c);//equal value and equal type
        console.log(a!==b);//not equal value and not equal type
        console.log(a>b);
        console.log(a<b);
        console.log(a>=c);
        console.log(a<=b);
        console.log(a==c);
    </script>
</body>
</html>
