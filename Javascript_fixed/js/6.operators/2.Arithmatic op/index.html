<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // arithmetic operators
        let a=10
        let b=20    

        let c=a+b
        console.log(c); 

        let d=a-b
        console.log(d);

        let e=a*b
        console.log(e);

        let f=a/b
        console.log(f);

        let g=a%b
        console.log(g); 

        
    </script>
</body>
