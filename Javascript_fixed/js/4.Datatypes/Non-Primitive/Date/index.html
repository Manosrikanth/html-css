<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // date methods
        let date=new Date()
        console.log(date);

        let b=date.getDate()
        console.log(b);

        let c=date.getDay()
        console.log(c);

        let d=date.getFullYear()
        console.log(d);

        let e=date.getMonth()
        console.log(e);

        let f=date.getHours()
        console.log(f);

        let g=date.getMinutes()
        console.log(g);
    </script>
</body>
</html>
